<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filtered Temple Album</title>
    <meta name="description" content="A responsive temple gallery with filtering and lazy-loaded images." />
    <meta name="author" content="Victor Manuel Malpica Castro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/filtered-temples.css" />
    <link rel="stylesheet" href="styles/filtered-temples-large.css" />
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/filtered-temples.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <span>Temple Album</span>
        <button id="menu-button" aria-expanded="false" aria-label="Toggle navigation">Menu</button>
      </div>
      <nav class="navigation" aria-label="Temple filters">
        <ul>
          <li><a href="#" class="active" data-filter="home">Home</a></li>
          <li><a href="#" data-filter="old">Old</a></li>
          <li><a href="#" data-filter="new">New</a></li>
          <li><a href="#" data-filter="large">Large</a></li>
          <li><a href="#" data-filter="small">Small</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Temple Album</h1>
      <p class="intro">Browse temples by age or size using the menu above.</p>
      <div id="temple-grid" class="temple-grid" aria-live="polite"></div>
    </main>

    <footer>
      <p>&copy; <span id="currentyear"></span> &#10026; Victor Manuel Malpica Castro &#10026; Venezuela</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
