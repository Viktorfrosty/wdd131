<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse the Artisan Bakehouse menu and save your favorite bakery items.">
  <meta name="author" content="Victor Manuel Malpica Castro">
  <title>Menu | The Artisan Bakehouse</title>
  <link rel="stylesheet" href="styles/site.css">
  <script src="scripts/site.js" defer></script>
  <script src="scripts/getdates.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="top-bar">
      <a class="logo" href="index.html" aria-label="The Artisan Bakehouse home">
        <img src="images/logo_bakery.png" alt="The Artisan Bakehouse logo">
      </a>
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="primary-navigation">Menu</button>
    </div>
    <nav id="primary-navigation" class="primary-navigation" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <section class="page-intro">
      <h1>Menu Catalog</h1>
      <p>Filter our bakery and café items by category, discover new favorites, and save the selections you want to try next.</p>
    </section>
    <section class="menu-controls">
      <div class="filters" role="group" aria-label="Filter bakery menu">
        <button class="filter-button active" data-filter="all">All</button>
        <button class="filter-button" data-filter="bread">Bread</button>
        <button class="filter-button" data-filter="pastry">Pastries</button>
        <button class="filter-button" data-filter="coffee">Coffee</button>
      </div>
      <p id="favorite-count" class="favorite-count">Favorites saved: 0</p>
    </section>
    <section id="menu-grid" class="menu-grid" aria-live="polite"></section>
  </main>
  <footer class="site-footer">
    <p>&copy; <span id="currentYear"></span> The Artisan Bakehouse & Café</p>
  </footer>
</body>
</html>
